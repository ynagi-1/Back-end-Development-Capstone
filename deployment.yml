apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: djangoserver
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
      - image: us.icr.io/sn-labs-naborpabor/djangoserver:1
        imagePullPolicy: Always
        name: djangoserver
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: SONGS_SERVICE_URL
          value: http://songs:8080/song
        - name: PICTURES_SERVICE_URL
          value: https://pictures.2gbysingtt1n.us-south.codeengine.appdomain.cloud/picture
        - name: DJANGO_DEBUG
          value: "1"
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      restartPolicy: Always
